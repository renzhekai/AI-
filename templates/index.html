<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>ai学习网站</title>
		<link rel="stylesheet" href="/static/style.css" />
	</head>
	<body>
		<div class="title_main">
			<img src="/static/img/logo2.jpg" alt="logo" />
			<div class="title_a">
				<a href="#">首页</a>
				<a href="#">漏洞地图</a>
				<a href="#">苏格拉底辅导</a>
				<a href="#">学习记录</a>
			</div>
		</div>
		<div class="main">
			<p id="up">不只是学，</p>
			<p id="down">更是学会思考</p>
			<h3>AI通过5-10道题分析你的知识漏洞，像家教一样一步步追问，引导你自己想明白。</h3>
			<div class="button1">
				<a href="#">立即体验</a>
			</div>
			<div class="button2">
				<a href="#">查看学习记录</a>
			</div>
			<div class="index">
				<p class="buju">核心功能布局</p>
				<div class="all">
					<div class="Vulnerability_Map">
						<p class="title">知识漏洞地图</p>
						<p class="text">红色=薄弱点,绿色=已掌握,AI自动帮你查漏补缺</p>
					</div>
					<div class="Socrates">
						<p class="title">苏格拉底辅导</p>
						<p class="text">AI不会直接给答案,而是通过追问引导学生自己理解</p>
					</div>
					<div class="Study_Record">
						<p class="title">学习进度报告</p>
						<p class="text">记录你的学习进度,让进步能被看见</p>
				</div>
			</div>
		</div>
	</body>
</html>
