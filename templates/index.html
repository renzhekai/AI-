<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>ai学习网站</title>
		<link rel="stylesheet" href="/static/index_style.css" />
		<link rel="stylesheet" href="/static/public.css" />
	</head>
	<body>
		<div class="title_main">
			<img src="/static/img/logo.jpg" alt="logo" class="logo"/>
			<div class="title_a"><!-- 导航栏 -->
				<a href="/">首页</a>
				<a href="/map" class="need_login">漏洞地图</a>
				<a href="#" class="need_login">苏格拉底辅导</a>
				<a href="#" class="need_login">学习记录</a>
			</div>
			<div class="title_b">
				<a href="#" id="login_button">登录</a>
				<!-- 用户面板 -->
				<div class="user_menu" id="user_menu">
					<button class="avatar_button" id="avatar_button">
						<img src="/static/img/avatar.png" alt="头像" id="avatar_img" />
					</button>
					 <div class="main_menu" id="main_menu">
						 <div class="user_info">
						 	<img src="/static/img/avatar.png" alt="头像" id="menu_avatar" />
						 	<span id="username"></span>
						 </div>
						<button id="logout_button">退出登录</button>
					 </div>
				</div>
				<button id="name_button"></button>
			</div>
		</div>
		<div class="main">
			<p id="up">不只是学，</p>
			<p id="down">更是学会思考</p>
			<h3>AI通过5-10道题分析你的知识漏洞，像家教一样一步步追问，引导你自己想明白。</h3>
			<div class="button1">
				<a href="/map" class="need_login">立即体验</a>
			</div>
			<div class="button2">
				<a href="#" class="need_login">查看学习记录</a>
			</div>
			<div class="index">
				<p class="buju">核心功能布局</p>
				<div class="all">
					<div class="Vulnerability_Map">
						<p class="title">知识漏洞地图</p>
						<p class="text">红色=薄弱点,绿色=已掌握,AI自动帮你查漏补缺</p>
					</div>
					<div class="Socrates">
						<p class="title">苏格拉底辅导</p>
						<p class="text">AI不会直接给答案,而是通过追问引导学生自己理解</p>
					</div>
					<div class="Study_Record">
						<p class="title">学习进度报告</p>
						<p class="text">记录你的学习进度,让进步能被看见</p>
				</div>
			</div>
		</div>
		</div>
		<div id="Mask_layer" class="Mask_layer"></div><!-- 遮罩层 -->
		<div class="model" id="login_model"><!-- 登录弹窗类选择器 -->
			<span id="close" class="close">&times;</span><!--关闭按钮 -->
			<h2 class='denglu'>登录</h2><!-- 登录标题 -->
			<h2 class='zhuce'>注册</h2><!-- 注册标题 -->
			<input type="text" id="login_username" placeholder="请输入用户名" /><!-- 用户名输入栏 -->
			<input type="password" id="login_password" placeholder="请输入密码"/><!-- 密码输入栏 -->
			<input type="password" id="repeat_password" class="repeat_password" placeholder="请重复密码" />
			<button id="login_submit">
				<span class="login_button">登录</span>
				<span class="register_button">注册</span>
			</button><!-- 登录注册按钮 -->
		</div>
		<script src="/static/index.js"></script>
	</body>
</html>
